<!DOCTYPE html>
<html>

<head>
    <title>Influencer Hub - Submit Your Work</title>
</head>

<body>

    <header style="background-color: #c7dfe2; padding: 10px; text-align: center; border-bottom: 2px solid #dee2e6;">
        <h1>Submit Your Picture Masterpiece</h1>
        <nav>
            <ul>
                <li><a href="About us.html" style="color: #0b2d52; text-decoration: none;">About us</a></li>
                <li><a href="index.html" style="color: #0b2d52; text-decoration: none;">Home</a></li>
                <li><a href="submit.html" style="color: #052e5a; text-decoration: none;">Resources & Tools</a></li>
                <li><a href="Resources & Tools.html" style="color: #072a4f; text-decoration: none;">Submit your Work</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="submission-form" style="margin-top: 20px;">
            <h2>Share Your Best Work</h2>
            <p style="color: #495057;">Showcase your high-quality pictures and Let the community see your talent!</p>
            <form action="#" method="post" style="padding: 5px; border: 1px solid #ced4da; border-radius: 5px;">
                <div style="margin-bottom: 30px;">
                    <label for="firstname" style="display: block; color: #343a40;">First Name:</label>
                    <input type="text" id="firstname" name="firstname" required style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                    </div>
                <div style="margin-bottom: 30px;">
                    <label for="lastname" style="display: block; color: #343a40;">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" required style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                </div>
                <div style="margin-bottom: 30px;">
                    <label for="platform" style="display: block; color: #343a40;">Social Media Platform:</label>
                    <select id="platform" name="platform" style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                        <option value="instagram">Instagram</option>
                        <option value="tiktok">TikTok</option>
                        <option value="pinterest">Pinterest</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div style="margin-bottom: 30px;">
                    <label for="handle" style="display: block; color: #343a40;">Social Media Handle:</label>
                    <input type="text" id="handle" name="handle" required style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                </div>
                <div style="margin-bottom: 30px;">
                    <label for="gender" style="display: block; color: #343a40;">Gender:</label>
                    <select id="gender" name="gender" style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div style="margin-bottom: 30px;">
                    <label for="niche" style="display: block; color: #343a40;">Niche:</label>
                    <select id="niche" name="niche" style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Makeup and Beauty">Makeup</option>
                        <option value="Skincare">Skincare</option>
                        <option value="Hair">Skincare</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div style="margin-bottom: 30px;">
                    <label for="age" style="display: block; color: #5f7081;">Age:</label>
                    <input type="number" id="age" name="age" style="width: 200px; padding: 5px; border: 1px solid #ced4da; border-radius: 3px;">
                </div>
                <div style="margin-bottom: 30px;">
                    <label for="image" style="display: block; color: #970561;">Upload Your Masterpiece:</label>
                    <input type="file" id="image" name="image" style="padding: 5px; border: 1px solid #ced4da; border-radius: 3px;"><br>
                    <small style="color: #6c757d;">Please upload a high-quality image.</small>
                    </div>
                <div style="margin-top: 20px;">
                    <button type="submit" style="padding: 10px 20px; background-color: #514197; color: white; border: none; border-radius: 5px; cursor: pointer;">Submit for
                        Review</button>
                    </div>
            </form>
        </section>
    </main>

    <footer style="background-color: #dfe8e7; padding: 10px; text-align: center; border-top: 2px solid #dee2e6; color: #6c757d;">

        <p style="color: #dc7327;">Stay bold, stay creative, stay you!</p>

        <p>&copy; 2025 Influencer Hub</p>
    </footer>

</body>

</html>
